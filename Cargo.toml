[package]
name = "day-counter"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rustybuzz = "0.20.1"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
webp = { version = "0.3.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
